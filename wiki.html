<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知識庫 Wiki | 演算法講義</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body data-root="./" data-page="wiki">
  <div class="layout">
    <article class="lesson" id="wiki"><p>載入中…</p></article>
    <aside class="toc"></aside>
  </div>
  <script src="assets/lessons.js"></script>
  <script src="assets/problems.js"></script>
  <script src="assets/main.js"></script>
  <script>
  // LLM Wiki 檢視器：讀取 wiki/<slug>.md，解析 frontmatter 與 [[雙括號連結]]。
  (async function () {
    const el = document.getElementById("wiki");
    const slug = new URLSearchParams(location.search).get("p") || "index";
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    if (!/^[a-z0-9-]+$/.test(slug)) { el.innerHTML = "<h1>找不到頁面</h1>"; return; }
    let text;
    try {
      const res = await fetch(`wiki/${slug}.md`);
      if (!res.ok) throw new Error(res.status);
      text = await res.text();
    } catch {
      el.innerHTML = `<h1>找不到頁面</h1><p>wiki/${esc(slug)}.md 不存在。<a href="wiki.html">回目錄</a></p>`;
      return;
    }
    // frontmatter
    const meta = {};
    text = text.replace(/^---\n([\s\S]*?)\n---\n/, (_, fm) => {
      fm.split("\n").forEach((line) => {
        const m = line.match(/^(\w+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^\[|\]$/g, "").split(",").map((s) => s.trim()).filter(Boolean);
      });
      return "";
    });
    // [[slug]] 或 [[slug|文字]] → 站內連結
    text = text.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (_, s, label) => `[${label || s}](wiki.html?p=${s})`);
    el.innerHTML = window.marked ? marked.parse(text) : `<pre>${esc(text)}</pre>`;

    document.title = `${(meta.title || [slug])[0]} | 演算法講義 Wiki`;
    const h1 = el.querySelector("h1");
    const info = document.createElement("div");
    info.className = "meta";
    const lesson = meta.lesson && meta.lesson[0];
    info.innerHTML =
      (meta.type ? `<span class="tag">${esc(meta.type[0])}</span>` : "") +
      (meta.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("") +
      (lesson ? `<a href="lessons/${esc(lesson)}.html">⚔ 對應講義與挑戰</a>` : "") +
      (meta.updated ? `<span>更新 ${esc(meta.updated[0])}</span>` : "");
    const crumb = document.createElement("div");
    crumb.className = "breadcrumb";
    crumb.innerHTML = slug === "index" ? "知識庫 Wiki" : `<a href="wiki.html">知識庫 Wiki</a> / ${esc(slug)}`;
    if (h1) { h1.before(crumb); h1.after(info); } else el.prepend(crumb);
    if (meta.related && slug !== "index") {
      const rel = document.createElement("p");
      rel.innerHTML = "<strong>相關頁面：</strong>" + meta.related.map((s) => `<a href="wiki.html?p=${esc(s)}">${esc(s)}</a>`).join("、");
      el.append(rel);
    }
    const toc = document.querySelector(".toc");
    const heads = [...el.querySelectorAll("h2")];
    heads.forEach((h, i) => (h.id = "s" + (i + 1)));
    toc.innerHTML = heads.length ? "<strong>CONTENTS</strong>" + heads.map((h) => `<a href="#${h.id}">${esc(h.textContent)}</a>`).join("") : "";
  })();
  </script>
</body>
</html>
